version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ============================================================================
  orbit-postgres:
    image: postgis/postgis:16-3.4
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_password_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit_user} -d ${POSTGRES_DB:-orbit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis 7.2 Cache & Celery Broker
  # ============================================================================
  orbit-redis:
    image: redis:7.2-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
